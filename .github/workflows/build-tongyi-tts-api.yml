name: Build Tongyi-compatible Dify API

on:
  workflow_dispatch:
  push:
    tags:
      - "tongyi-tts-v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY}/dify-api"
          echo "name=${image_name,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile.tongyi-tts
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:tongyi-tts-latest
            ${{ steps.image.outputs.name }}:tongyi-tts-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
